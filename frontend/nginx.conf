# Serves the built SPA and proxies everything Django needs to the `backend`
# service (same origin from the browser's point of view — no CORS needed,
# same property the Vite dev proxy gives you locally; see docs/ARCHITECTURE.md).

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Django JSON API (main/urls.py) — includes document downloads.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin.
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own static files (admin CSS/JS), served by WhiteNoise inside
    # the backend container — proxied through so /admin/ works end to end.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # The React SPA. try_files falls back to index.html so client-side
    # routing (whatever route the user is on) still loads the app on refresh.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
